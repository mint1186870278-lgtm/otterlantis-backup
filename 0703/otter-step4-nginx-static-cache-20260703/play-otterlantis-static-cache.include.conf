# Include this inside the existing `server { ... }` block for play.otterlantis.com.
# Keep these location blocks before any generic `location / { ... }` fallback.

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location ~* ^/assets/.*\.(?:js|css|wasm)$ {
    try_files $uri =404;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
}

location ~* \.(?:glb|gltf|bin|ktx2)$ {
    types {
        model/gltf-binary glb;
        model/gltf+json gltf;
        application/octet-stream bin;
        image/ktx2 ktx2;
    }
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Accept-Ranges "bytes" always;
}

location ~* \.(?:webp|png|jpg|jpeg|svg|gif|mp3|ogg)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header Access-Control-Allow-Origin "*" always;
}


worker_processes 1;
error_log /tmp/otter-nginx-dry-run-error.log warn;
pid /tmp/otter-nginx-dry-run.pid;

events {
    worker_connections 64;
}

http {
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/webp webp;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        image/gif gif;
        audio/mpeg mp3;
        audio/ogg ogg;
        application/wasm wasm;
        model/gltf-binary glb;
        model/gltf+json gltf;
        application/octet-stream bin;
        image/ktx2 ktx2;
    }

    server {
        listen 127.0.0.1:18080;
        server_name play.otterlantis.com;
        root /www/wwwroot/play.otterlantis.com;

        include __PLAY_STATIC_CACHE_INCLUDE__;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
